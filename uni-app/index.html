<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta name="theme-color" content="#FF6B35" />
    <title>鼎恒餐饮</title>
    <script>
      // H5 端自适应（小程序端忽略）
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('position: sticky') || CSS.supports('position: -webkit-sticky'));
      document.write('<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"' + (coverSupport ? ', viewport-fit=cover' : '') + '" />');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
