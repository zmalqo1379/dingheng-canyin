<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>供应商登录/注册 - 鼎恒餐饮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #ff6b35;
      --accent-2: #ff8e53;
      --red: #ef4444;
      --line: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #ff6b35 140%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .top {
      background: linear-gradient(135deg, #1f2937, #374151 70%, var(--accent));
      color: #fff;
      padding: 28px 28px 24px;
      text-align: center;
    }
    .top .logo {
      width: 56px; height: 56px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .top h1 { font-size: 22px; font-weight: 700; }
    .top .sub { font-size: 13px; opacity: 0.9; margin-top: 6px; }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 15px;
      color: #9ca3af;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
      background: none;
      border-top: none; border-left: none; border-right: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .body { padding: 24px 28px 30px; }
    .pane { display: none; }
    .pane.active { display: block; }
    .form-group { margin-bottom: 13px; }
    .form-group label {
      display: block; font-size: 13px; color: #4b5563;
      margin-bottom: 6px; font-weight: 500;
    }
    .input {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--line); border-radius: 11px;
      font-size: 15px; background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,107,53,.14); }
    .categories {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .cat-chip {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      font-size: 13px; color: #6b7280;
      cursor: pointer; user-select: none;
      transition: all .15s;
      background: #fff;
    }
    .cat-chip:hover { border-color: var(--accent); color: var(--accent); }
    .cat-chip.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .alert {
      color: var(--red); font-size: 13px;
      margin-bottom: 12px; text-align: center;
      background: #fef2f2; padding: 9px;
      border-radius: 9px; display: none;
    }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 6px; transition: transform .1s, box-shadow .2s;
    }
    .btn:hover { box-shadow: 0 8px 20px rgba(255,107,53,.35); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .back { text-align: center; margin-top: 16px; }
    .back a { font-size: 13px; color: #9ca3af; text-decoration: none; }
    .back a:hover { color: var(--accent); }
    .tip { font-size: 12px; color: #bbb; text-align: center; margin-top: 12px; }

    /* ============ 欢迎弹窗（深色系：藏青到深灰，体现稳重生意感） ============ */
    .welcome-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: none; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      padding: 20px;
    }
    .welcome-overlay.show { display: flex; animation: wFadeIn .25s ease both; }
    .welcome-card {
      width: 420px; max-width: 90%;
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.32), 0 4px 16px rgba(0,0,0,.14);
      position: relative;
    }
    .welcome-overlay.show .welcome-card { animation: wRise .38s cubic-bezier(.22,.85,.3,1.1) both; }
    @keyframes wFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .w-band {
      background: linear-gradient(135deg, #1e2a44 0%, #2c3446 100%);
      color: #fff; text-align: center;
      padding: 26px 52px 22px; position: relative;
    }
    .w-band h2 { font-size: 19px; font-weight: 700; letter-spacing: 2px; text-indent: 2px; }
    .w-band .w-bar { width: 36px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.45); margin: 12px auto 0; }
    .w-close {
      position: absolute; top: 10px; right: 10px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,.16); color: #fff;
      border: none; font-size: 15px; line-height: 30px;
      cursor: pointer; transition: background .2s;
    }
    .w-close:hover { background: rgba(255,255,255,.3); }
    .w-body { padding: 22px 26px 6px; }
    .w-body p { font-size: 13.5px; color: #4b5563; line-height: 1.85; margin: 0 0 9px; }
    .w-body p strong { color: #111827; font-weight: 700; }
    .w-cta { padding: 14px 26px 22px; }
    .w-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #1f2a44, #39435c);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; letter-spacing: 2px;
      cursor: pointer; transition: transform .1s, box-shadow .2s;
      box-shadow: 0 10px 24px rgba(31,42,68,.35);
    }
    .w-btn:hover { box-shadow: 0 12px 28px rgba(31,42,68,.45); }
    .w-btn:active { transform: scale(.99); }
    .w-note { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">🚚</div>
      <h1>供应商登录/注册</h1>
      <div class="sub">鼎恒餐饮·供应链采购平台</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="login">登录</button>
      <button class="tab" data-tab="register">注册</button>
    </div>
    <div class="body">
      <!-- 登录 -->
      <div class="pane active" id="pane-login">
        <div class="alert" id="loginAlert"></div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="input" id="loginPhone" placeholder="请输入手机号" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="input" id="loginPwd" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn">登 录</button>
        <div class="tip">登录成功后将跳转到供应商控制台</div>
      </div>

      <!-- 注册 -->
      <div class="pane" id="pane-register">
        <div class="alert" id="regAlert"></div>
        <div class="form-group">
          <label>供应商名称</label>
          <input type="text" class="input" id="name" placeholder="如：XX农贸供应商">
        </div>
        <div class="form-group">
          <label>联系人</label>
          <input type="text" class="input" id="contact" placeholder="联系人姓名">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="input" id="regPhone" placeholder="手机号（用于登录）" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="input" id="regPwd" placeholder="设置登录密码" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" class="input" id="regPwd2" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>主营品类（多选）</label>
          <div class="categories" id="catList">
            <span class="cat-chip" data-cat="蔬菜">蔬菜</span>
            <span class="cat-chip" data-cat="肉类">肉类</span>
            <span class="cat-chip" data-cat="冻品">冻品</span>
            <span class="cat-chip" data-cat="粮油">粮油</span>
            <span class="cat-chip" data-cat="酱料">酱料</span>
            <span class="cat-chip" data-cat="一次性用品">一次性用品</span>
          </div>
        </div>
        <button class="btn" id="regBtn">注 册</button>
        <div class="tip">注册成功后将自动登录并跳转</div>
      </div>

      <div class="back"><a href="/index.html">← 返回首页</a></div>
    </div>
  </div>

  <!-- 欢迎弹窗：首次访问显示，关闭后 7 天内不再显示 -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div class="w-band">
        <h2>致供应商伙伴</h2>
        <div class="w-bar"></div>
        <button class="w-close" id="welcomeClose" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="w-body">
        <p>你的货不差，缺的只是更多稳定的买家。</p>
        <p>加入鼎恒供应链，全城的餐馆都在这个平台上采购。</p>
        <p>不用雇业务员，不用挨个打电话、加微信，</p>
        <p><strong>订单自己找上门。</strong></p>
        <p>接单、发货、对账，手机上全部搞定，笔笔清楚。</p>
        <p>你只负责备好货、送好货——</p>
        <p><strong>生意这件事，从此简单。</strong></p>
      </div>
      <div class="w-cta">
        <button class="w-btn" id="welcomeCta" type="button">免费入驻，开始接单</button>
        <div class="w-note">平台免费使用，按双方协议约定结算</div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // 欢迎弹窗：首次访问显示，关闭后 7 天内不再显示（记录关闭时间戳）
    const WELCOME_KEY = 'supplier_welcome_closed_at';
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const welcomeOverlay = $('welcomeOverlay');
    (function maybeShowWelcome() {
      const closedAt = Number(localStorage.getItem(WELCOME_KEY) || 0);
      if (closedAt && Date.now() - closedAt < WEEK_MS) return;
      setTimeout(() => welcomeOverlay.classList.add('show'), 300);
    })();
    function closeWelcome() {
      welcomeOverlay.classList.remove('show');
      localStorage.setItem(WELCOME_KEY, String(Date.now()));
    }
    $('welcomeClose').onclick = closeWelcome;
    welcomeOverlay.addEventListener('click', (e) => {
      if (e.target === welcomeOverlay) closeWelcome();
    });
    $('welcomeCta').onclick = () => {
      closeWelcome();
      document.querySelector('.tab[data-tab="register"]').click();
    };

    const selectedCats = new Set();
    document.querySelectorAll('.cat-chip').forEach(c => {
      c.onclick = () => {
        const cat = c.dataset.cat;
        if (selectedCats.has(cat)) {
          selectedCats.delete(cat);
          c.classList.remove('active');
        } else {
          selectedCats.add(cat);
          c.classList.add('active');
        }
      };
    });

    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
        const tab = t.dataset.tab;
        $('pane-login').classList.toggle('active', tab === 'login');
        $('pane-register').classList.toggle('active', tab === 'register');
        $('loginAlert').style.display = 'none';
        $('regAlert').style.display = 'none';
      };
    });

    function showAlert(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
    }

    // 登录
    $('loginBtn').onclick = async () => {
      const phone = $('loginPhone').value.trim();
      const password = $('loginPwd').value;
      if (!phone || !password) return showAlert($('loginAlert'), '请输入手机号和密码');
      $('loginBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/supplier/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        }).then(r => r.json());
        if (res.success) {
          localStorage.setItem('supplierToken', res.data.token);
          localStorage.setItem('supplierId', res.data.supplierId);
          localStorage.setItem('supplierName', res.data.supplierName);
          location.href = '/supplier-dashboard.html';
        } else {
          showAlert($('loginAlert'), res.message || '登录失败');
        }
      } catch (e) {
        showAlert($('loginAlert'), '网络错误，请重试');
      } finally {
        $('loginBtn').disabled = false;
      }
    };

    // 注册
    $('regBtn').onclick = async () => {
      const name = $('name').value.trim();
      const contact = $('contact').value.trim();
      const phone = $('regPhone').value.trim();
      const password = $('regPwd').value;
      const confirm = $('regPwd2').value;
      if (!name || !contact || !phone || !password) return showAlert($('regAlert'), '请填写完整信息');
      if (password !== confirm) return showAlert($('regAlert'), '两次输入的密码不一致');
      if (password.length < 6) return showAlert($('regAlert'), '密码至少6位');
      if (selectedCats.size === 0) return showAlert($('regAlert'), '请至少选择一个主营品类');
      $('regBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/supplier/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, contact, phone, password, confirm,
            categories: Array.from(selectedCats)
          })
        }).then(r => r.json());
        if (res.success) {
          localStorage.setItem('supplierToken', res.data.token);
          localStorage.setItem('supplierId', res.data.supplierId);
          localStorage.setItem('supplierName', res.data.supplierName);
          location.href = '/supplier-dashboard.html';
        } else {
          showAlert($('regAlert'), res.message || '注册失败');
        }
      } catch (e) {
        showAlert($('regAlert'), '网络错误，请重试');
      } finally {
        $('regBtn').disabled = false;
      }
    };
  </script>
</body>
</html>
