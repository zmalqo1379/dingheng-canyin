<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鼎恒科技</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* ============ 品牌区（控制高度、不撑满） ============ */
    .hero {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 72px 24px 64px;
      /* 柔和高级渐变背景 */
      background:
        radial-gradient(ellipse 60% 45% at 18% 12%, rgba(255,255,255,0.16), transparent 60%),
        radial-gradient(ellipse 55% 40% at 85% 78%, rgba(255,214,170,0.22), transparent 65%),
        radial-gradient(ellipse 40% 30% at 50% 105%, rgba(120,40,10,0.30), transparent 70%),
        linear-gradient(160deg, #ff7a3d 0%, #f9682f 40%, #e04e22 78%, #c93f1a 100%);
      position: relative;
      overflow: hidden;
    }
    /* 预留背景图位置：如需替换为真实海报图，将 url() 填入即可
    .hero {
      background-image: linear-gradient(160deg, rgba(249,104,47,.88), rgba(201,63,26,.88)), url('/img/hero.jpg');
      background-size: cover;
      background-position: center;
    }
    */
    /* 细腻光斑装饰 */
    .hero::before {
      content: '';
      position: absolute;
      top: -120px; right: -80px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -140px; left: -60px;
      width: 380px; height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,180,0.12), transparent 70%);
      pointer-events: none;
    }
    .hero > * { position: relative; z-index: 1; }

    /* 主标题：鼎恒科技 */
    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 6px;
      /* 补偿 letter-spacing 造成的视觉右偏，保证居中 */
      text-indent: 6px;
      text-shadow: 0 4px 18px rgba(0,0,0,0.2);
      line-height: 1.2;
    }
    /* 副标题：主标题下方独立成行，半透明白 + 宽字距，约为主标题 40% */
    .hero .brand-sub {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 5px;
      text-indent: 5px;
      color: rgba(255,255,255,0.72);
    }
    /* 功能描述行 */
    .hero .subtitle {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 2px;
      text-indent: 2px;
      color: rgba(255,255,255,0.88);
    }
    /* slogan 行：副标题下方 */
    .hero .slogan {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 4px;
      text-indent: 4px;
      color: rgba(255,255,255,0.6);
    }

    /* ============ 三大入口卡片 ============ */
    .entries {
      flex: 1 0 auto;
      display: flex;
      gap: 22px;
      justify-content: center;
      align-items: center;
      padding: 48px 24px 60px;
      background: linear-gradient(180deg, #fff7f3 0%, #fdf1ea 100%);
      flex-wrap: wrap;
    }
    .entry {
      flex: 1 1 240px;
      max-width: 320px;
      min-height: 200px;
      border-radius: 22px;
      padding: 30px 24px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 26px rgba(120,50,20,0.16), 0 2px 6px rgba(120,50,20,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .entry::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.18), transparent 45%);
      pointer-events: none;
    }
    .entry:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(120,50,20,0.24), 0 4px 10px rgba(120,50,20,0.10); }
    .entry:active { transform: scale(0.99); }
    .entry-merchant { background: linear-gradient(150deg, #ff8a4c, #f96a2c 55%, #ef5a1e); }
    .entry-supplier { background: linear-gradient(150deg, #3b4453, #232b38 60%, #ff7a3d 165%); }
    .entry-dev { background: linear-gradient(150deg, #1aa38f, #0f766e 60%, #0b5f59); }
    /* 矢量线性图标 */
    .entry .ico {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      background: rgba(255,255,255,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
    }
    .entry .ico svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .entry .t { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .entry .d { font-size: 13px; opacity: 0.88; letter-spacing: 0.5px; }

    /* ============ Footer ============ */
    .footer {
      background: #1f2937;
      color: #9ca3af;
      padding: 26px 20px;
      text-align: center;
      font-size: 13px;
    }
    .footer .links { margin-bottom: 10px; }
    .footer .links a {
      color: #cbd5e1;
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.2s;
    }
    .footer .links a:hover { color: #ff8e53; }
    .footer .copyright { font-size: 12px; color: #6b7280; }
    .footer .beian { margin-top: 6px; font-size: 12px; color: #6b7280; }
    .footer .beian a { color: #6b7280; text-decoration: none; }
    .footer .beian a:hover { color: #cbd5e1; }

    /* ============ 响应式：手机端 ============ */
    @media (max-width: 768px) {
      /* 顶部品牌区：紧凑横幅 */
      .hero {
        padding: 46px 18px 40px;
        gap: 0;
      }
      .hero h1 { font-size: 28px; letter-spacing: 4px; text-indent: 4px; }
      /* 副标题独立成行，主标题 40% 左右字号 + 宽字距 */
      .hero .brand-sub { margin-top: 10px; font-size: 12px; letter-spacing: 3px; text-indent: 3px; }
      .hero .subtitle { margin-top: 14px; font-size: 12px; letter-spacing: 1px; text-indent: 1px; }
      .hero .slogan { margin-top: 8px; font-size: 11px; letter-spacing: 2px; text-indent: 2px; }

      /* 入口卡片：纵向全宽 */
      .entries {
        padding: 24px 16px 32px;
        gap: 12px;
        flex-direction: column;
        align-items: stretch;
      }
      .entry {
        flex: 1 1 auto;
        max-width: none;
        min-height: 104px;
        padding: 20px 22px;
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
        gap: 16px;
      }
      .entry .ico { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; }
      .entry .ico svg { width: 24px; height: 24px; }
      .entry .txt { display: flex; flex-direction: column; gap: 4px; }
      .entry .t { font-size: 17px; }
      .entry .d { font-size: 12px; }
      /* 右侧箭头 */
      .entry .arrow {
        margin-left: auto;
        flex-shrink: 0;
        width: 20px; height: 20px;
        stroke: rgba(255,255,255,0.75);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    }
    /* 电脑端隐藏箭头 */
    .entry .arrow { display: none; }
    @media (max-width: 768px) { .entry .arrow { display: block; } }
  </style>
</head>
<body>
