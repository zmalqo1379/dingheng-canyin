<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鼎恒餐饮 - 扫码点餐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      background: linear-gradient(135deg, #ff6b35 0%, #ff8e53 100%);
      color: #fff;
      padding: 60px 20px 80px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }
    .header h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
    .header p { font-size: 15px; opacity: 0.9; }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 0 20px;
      margin-top: -40px;
      flex: 1;
    }
    .entry-card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: #333;
    }
    .entry-card:active { transform: scale(0.98); }
    .entry-card:hover { box-shadow: 0 8px 24px rgba(255,107,53,0.2); }
    .entry-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      flex-shrink: 0;
    }
    .icon-customer { background: linear-gradient(135deg, #ff6b35, #ff8e53); }
    .icon-kitchen { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .icon-admin { background: linear-gradient(135deg, #667eea, #764ba2); }
    .entry-text h3 { font-size: 18px; margin-bottom: 4px; }
    .entry-text p { font-size: 13px; color: #999; }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #bbb;
      font-size: 12px;
    }
    .shop-name {
      margin-top: 12px;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍽️ 鼎恒餐饮</h1>
    <p>扫码点餐 · 智能餐厅</p>
    <div class="shop-name" id="shopName">鼎恒餐饮</div>
  </div>
  <div class="container">
    <a class="entry-card" href="customer.html">
      <div class="entry-icon icon-customer">🍴</div>
      <div class="entry-text">
        <h3>顾客点餐</h3>
        <p>扫码下单，便捷快速</p>
      </div>
    </a>
    <a class="entry-card" href="kitchen.html">
      <div class="entry-icon icon-kitchen">👨‍🍳</div>
      <div class="entry-text">
        <h3>后厨看单</h3>
        <p>实时接单，语音播报</p>
      </div>
    </a>
    <a class="entry-card" href="admin.html">
      <div class="entry-icon icon-admin">⚙️</div>
      <div class="entry-text">
        <h3>管理后台</h3>
        <p>数据统计 · 菜单管理</p>
      </div>
    </a>
  </div>
  <div class="footer">
    © 2026 鼎恒餐饮 扫码点餐系统
  </div>

  <script>
    fetch('/api/settings').then(r => r.json()).then(res => {
      if (res.success && res.data && res.data.shopName) {
        document.getElementById('shopName').textContent = res.data.shopName;
        document.title = res.data.shopName + ' - 扫码点餐';
      }
    }).catch(() => {});
  </script>
</body>
</html>
