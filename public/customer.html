<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>扫码点餐</title>
  <style>
    :root {
      --orange: #ff5e00;
      --orange-2: #ff8a3d;
      --orange-deep: #f04b00;
      --orange-bg: #fff3ea;
      --text: #262626;
      --text-2: #6b6b6b;
      --text-3: #9b9b9b;
      --bg: #f5f6f8;
      --card: #fff;
      --nav-h: 0px;
      --radius: 14px;
      --cart-space: 96px;
      /* ===== 店铺风格主题变量（默认值 = 经典橙）===== */
      --accent: #ff5e00;
      --accent-2: #ff8a3d;
      --accent-deep: #f04b00;
      --accent-bg: #fff3ea;
      --btn-bg: linear-gradient(135deg, #ff8a3d, #ff5e00);
      --btn-text: #fff;
      --banner-grad: linear-gradient(135deg, #ff9a44 0%, #ff6a1f 55%, #f55100 100%);
      --banner-text: #fff;
      --banner-radius: 0 0 22px 22px;
      --success-grad: linear-gradient(160deg, #ff9a44, #f55100);
      --card-shadow: 0 1px 4px rgba(30,30,30,.04);
      --accent-shadow-color: rgba(255,94,0,.35);
      --line: #f5f5f5;
      --line-strong: #e8e8e8;
      --input-bg: #fafafa;
      --sk1: #ececec;
      --sk2: #f6f6f6;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      --font-title: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    }

    /* ================= 店铺风格主题包（body.theme-* 覆盖变量即可整套换肤） ================= */

    /* 简约白：现代极简、黑白灰 + 细线条 */
    body.theme-minimal {
      --accent: #1a1a1a;
      --accent-2: #4d4d4d;
      --accent-deep: #000000;
      --accent-bg: #f4f4f4;
      --btn-bg: #1a1a1a;
      --btn-text: #fff;
      --banner-grad: #ffffff;
      --banner-text: #1a1a1a;
      --banner-radius: 0;
      --success-grad: linear-gradient(160deg, #fbfbfb, #e9e9e9);
      --card-shadow: 0 0 0 1px #ececec;
      --accent-shadow-color: rgba(0,0,0,.14);
      --text: #1a1a1a;
      --text-2: #666666;
      --text-3: #9a9a9a;
      --bg: #fafafa;
      --radius: 10px;
      --line: #f0f0f0;
      --line-strong: #e6e6e6;
      --input-bg: #fafafa;
    }
    body.theme-minimal .banner { border-bottom: 1px solid #ececec; }
    body.theme-minimal .banner::before, body.theme-minimal .banner::after { display: none; }
    body.theme-minimal .shop-name { text-shadow: none; }
    body.theme-minimal .shop-logo { background: #f4f4f4; }
    body.theme-minimal .table-pill { background: #1a1a1a; border-color: #1a1a1a; }
    body.theme-minimal .banner-slogan { color: #9a9a9a; opacity: 1; }

    /* 时尚暗黑：深色底、金色点缀、高级感 */
    body.theme-dark {
      --accent: #e6c068;
      --accent-2: #d4af37;
      --accent-deep: #a8842c;
      --accent-bg: rgba(230,192,104,.12);
      --btn-bg: linear-gradient(135deg, #e6c068, #c49a3a);
      --btn-text: #241a05;
      --banner-grad: linear-gradient(135deg, #33302a 0%, #1d1b17 60%, #121110 100%);
      --banner-text: #f0e3c0;
      --banner-radius: 0 0 18px 18px;
      --success-grad: linear-gradient(160deg, #33302a, #121110);
      --card-shadow: 0 2px 8px rgba(0,0,0,.45);
      --accent-shadow-color: rgba(0,0,0,.5);
      --text: #f2f0ea;
      --text-2: #b8b4aa;
      --text-3: #86837b;
      --bg: #131313;
      --card: #1f1e1b;
      --radius: 12px;
      --line: rgba(255,255,255,.07);
      --line-strong: rgba(255,255,255,.14);
      --input-bg: #2a2926;
      --sk1: #2b2a27;
      --sk2: #35342f;
    }
    body.theme-dark .banner::before { background: rgba(230,192,104,.10); }
    body.theme-dark .banner::after { background: rgba(230,192,104,.07); }
    body.theme-dark .shop-name { text-shadow: 0 2px 6px rgba(0,0,0,.55); }
    body.theme-dark .table-pill { background: rgba(230,192,104,.14); border-color: rgba(230,192,104,.4); }

    /* 清新绿：浅绿圆润可爱，适合轻食/茶饮 */
    body.theme-green {
      --accent: #22a45d;
      --accent-2: #3cbf72;
      --accent-deep: #178a4c;
      --accent-bg: #e6f7ec;
      --btn-bg: linear-gradient(135deg, #3cbf72, #22a45d);
      --btn-text: #fff;
      --banner-grad: linear-gradient(135deg, #63d68f 0%, #2fae66 55%, #1d9a55 100%);
      --banner-text: #fff;
      --banner-radius: 0 0 26px 26px;
      --success-grad: linear-gradient(160deg, #63d68f, #1d9a55);
      --card-shadow: 0 2px 10px rgba(34,164,93,.10);
      --accent-shadow-color: rgba(34,164,93,.30);
      --text: #24382b;
      --text-2: #5d7466;
      --text-3: #8fa396;
      --bg: #f1faf3;
      --radius: 18px;
      --line: #eef6f0;
      --line-strong: #e2efe6;
      --input-bg: #f6fbf8;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Yuanti SC", "YouYuan", "Microsoft YaHei", sans-serif;
    }
    body.theme-green .shop-name { text-shadow: 0 2px 6px rgba(20,110,60,.28); }

    /* 国潮红金：中国红 + 金，传统大气 */
    body.theme-redgold {
      --accent: #c0272d;
      --accent-2: #d64541;
      --accent-deep: #9e1c22;
      --accent-bg: #fbeeec;
      --btn-bg: linear-gradient(135deg, #d64541, #ad262c);
      --btn-text: #fff;
      --banner-grad: linear-gradient(135deg, #b23a2f 0%, #9e2a25 55%, #7c1e1a 100%);
      --banner-text: #fff6e8;
      --banner-radius: 0 0 14px 14px;
      --success-grad: linear-gradient(160deg, #c0272d, #7c1e1a);
      --card-shadow: 0 2px 8px rgba(158,28,34,.08);
      --accent-shadow-color: rgba(158,28,34,.28);
      --text: #2d1d1a;
      --text-2: #7c625a;
      --text-3: #a8928a;
      --bg: #faf4ef;
      --radius: 10px;
      --line: #f6ece7;
      --line-strong: #edddd6;
      --input-bg: #fdf9f6;
      --font-title: "Noto Serif SC", "STSong", "Songti SC", "SimSun", serif;
    }
    body.theme-redgold .banner::before { background: rgba(255,215,130,.16); }
    body.theme-redgold .banner::after { background: rgba(255,215,130,.10); }
    body.theme-redgold .table-pill { background: rgba(255,255,255,.18); border-color: rgba(255,214,130,.55); }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    body.has-nav { --nav-h: 42px; }
    /* 电脑访问时：页面居中显示为手机宽度 */
    @media (min-width: 480px) {
      body { background: linear-gradient(160deg, #e8eaef, #dfe3ea); }
      .app { box-shadow: 0 0 48px rgba(0,0,0,.14); }
    }

    /* ---------- 商家预览返回栏（仅 preview=1 显示） ---------- */
    .back-nav {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 42px;
      background: #2b2b2b; color: #fff;
      display: none; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 999; font-size: 12px;
    }
    body.has-nav .back-nav { display: flex; }
    .back-nav .back-link { color: #fff; text-decoration: none; font-weight: 600; cursor: pointer; font-size: 13px; }
    .back-nav .hint { font-size: 11px; opacity: .7; }

    .app { padding-top: var(--nav-h); min-height: 100vh; background: var(--bg); }

    /* ---------- 顶部店铺横幅 ---------- */
    .banner {
      position: relative;
      background-color: var(--accent-deep);
      background-image: var(--banner-layer, var(--banner-grad));
      background-size: cover;
      background-position: center;
      color: var(--banner-text);
      padding: 22px 18px 20px;
      border-radius: var(--banner-radius);
      overflow: hidden;
    }
    .banner::before, .banner::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
    }
    .banner::before { width: 150px; height: 150px; top: -70px; right: -40px; }
    .banner::after { width: 90px; height: 90px; bottom: -40px; left: -20px; background: rgba(255,255,255,.09); }
    .banner-content { position: relative; z-index: 1; }
    .shop-line { display: flex; align-items: center; gap: 10px; }
    .shop-logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: rgba(255,255,255,.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      backdrop-filter: blur(4px);
      overflow: hidden;
    }
    .shop-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .shop-name {
      font-family: var(--font-title);
      font-size: 22px; font-weight: 800; letter-spacing: .5px;
      text-shadow: 0 2px 6px rgba(180,60,0,.25);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: calc(100% - 120px);
    }
    .banner-sub { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .table-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.24);
      border: 1px solid rgba(255,255,255,.35);
      padding: 4px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700;
      backdrop-filter: blur(4px);
    }
    .banner-slogan { font-size: 12px; opacity: .9; letter-spacing: 1px; }

    /* ---------- 骨架屏 ---------- */
    .sk-wrap { display: flex; padding: 14px 0 calc(var(--cart-space) + 14px); min-height: 70vh; }
    .sk { background: linear-gradient(90deg, var(--sk1) 25%, var(--sk2) 37%, var(--sk1) 63%); background-size: 400% 100%; animation: sk 1.2s ease infinite; border-radius: 8px; }
    @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .sk-side { width: 84px; flex-shrink: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 14px; }
    .sk-side .sk { height: 46px; }
    .sk-main { flex: 1; padding: 0 12px; }
    .sk-card { background: var(--card); border-radius: var(--radius); padding: 12px; display: flex; gap: 12px; margin-bottom: 12px; }
    .sk-card .sk-img { width: 84px; height: 84px; border-radius: 12px; flex-shrink: 0; }
    .sk-card .sk-col { flex: 1; padding-top: 4px; }
    .sk-card .sk-line { height: 15px; margin-bottom: 10px; }
    .sk-card .sk-line.short { width: 60%; }
    .sk-card .sk-line.tiny { width: 40%; margin-bottom: 0; }

    /* ---------- 主体：左分类 + 右菜品 ---------- */
    .main { display: flex; align-items: flex-start; }
    .sidebar {
      width: 84px; flex-shrink: 0;
      position: sticky; top: var(--nav-h);
      height: calc(100vh - var(--nav-h) - var(--cart-space) + 20px);
      overflow-y: auto; overflow-x: hidden;
      background: var(--bg);
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .sidebar-item {
      position: relative;
      padding: 15px 8px;
      text-align: center;
      font-size: 13px; color: var(--text-2);
      cursor: pointer; user-select: none;
      transition: color .15s, background .15s;
    }
    .sidebar-item.active {
      background: var(--card);
      color: var(--accent);
      font-weight: 700;
      border-radius: 12px 0 0 12px;
    }
    .sidebar-item.active::before {
      content: '';
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 16px;
      background: var(--accent); border-radius: 2px;
    }
    .sidebar-empty { padding: 24px 8px; text-align: center; font-size: 12px; color: var(--text-3); }

    .content { flex: 1; min-width: 0; padding: 12px 12px calc(var(--cart-space) + 16px); }
    .cat-section { scroll-margin-top: 12px; }
    .cat-title {
      font-size: 13px; color: var(--text-3);
      font-weight: 500; margin: 6px 2px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .empty-tip { text-align: center; padding: 70px 20px; color: var(--text-3); font-size: 13px; }
    .empty-tip .icon { font-size: 52px; margin-bottom: 10px; }

    /* ---------- 菜品卡片 ---------- */
    .dish-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 11px;
      display: flex; gap: 11px;
      margin-bottom: 11px;
      box-shadow: var(--card-shadow);
    }
    .dish-img {
      position: relative;
      width: 86px; height: 86px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .dish-ph {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px;
    }
    .dish-ph .ico { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.08)); }
    .dish-ph .cat-tag { font-size: 9px; color: rgba(0,0,0,.42); max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dish-photo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .soldout-mask {
      position: absolute; inset: 0; z-index: 2;
      background: rgba(0,0,0,.48);
      color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      letter-spacing: 2px;
    }
    .dish-card.soldout .dish-name, .dish-card.soldout .dish-desc, .dish-card.soldout .price { opacity: .5; }
    .dish-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .dish-name {
      font-size: 15px; font-weight: 700; color: var(--text);
      line-height: 1.35;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dish-desc {
      font-size: 12px; color: var(--text-3);
      margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4; min-height: 0;
    }
    .dish-meta { margin-top: auto; }
    .sales { font-size: 11px; color: var(--text-3); }
    .dish-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .price { color: var(--accent); font-weight: 800; }
    .price .sym { font-size: 12px; margin-right: 1px; }
    .price .num { font-size: 19px; letter-spacing: -.5px; }
    .price.big .num { font-size: 22px; }

    /* 数量加减器 */
    .stepper { display: flex; align-items: center; gap: 7px; }
    .step-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      font-size: 17px; line-height: 1;
      transition: transform .12s;
    }
    .step-btn:active { transform: scale(.86); }
    .step-btn:disabled { opacity: .4; cursor: not-allowed; }
    .step-btn.plus {
      background: var(--btn-bg);
      color: var(--btn-text);
      box-shadow: 0 3px 8px var(--accent-shadow-color);
      font-weight: 600;
    }
    .step-btn.minus {
      background: var(--card);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      font-weight: 700;
    }
    .step-num { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; color: var(--text); }

    /* ---------- 底部购物车栏 ---------- */
    .cart-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: transparent;
      z-index: 200;
      pointer-events: none;
    }
    .cart-bar-inner {
      pointer-events: auto;
      background: var(--card);
      border-radius: 999px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14);
      display: flex; align-items: center;
      padding: 8px 8px 8px 10px;
      gap: 10px;
    }
    .cart-icon {
      position: relative;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      margin-top: -22px;
      box-shadow: 0 6px 16px var(--accent-shadow-color);
      border: 4px solid var(--bg);
    }
    .cart-icon.bump { animation: bump .45s ease; }
    @keyframes bump {
      0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-6deg); }
      60% { transform: scale(.94) rotate(4deg); } 100% { transform: scale(1); }
    }
    .cart-badge {
      position: absolute; top: -6px; right: -6px;
      min-width: 19px; height: 19px;
      padding: 0 5px;
      background: #ff3141; color: #fff;
      font-size: 11px; font-weight: 700;
      border-radius: 10px;
      display: none; align-items: center; justify-content: center;
      border: 2px solid var(--card);
    }
    .cart-mid { flex: 1; min-width: 0; }
    .cart-sub { font-size: 11px; color: var(--text-3); }
    .cart-go {
      height: 42px; padding: 0 26px;
      border: none; border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-text); font-size: 15px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-shadow-color);
    }
    .cart-go:active { transform: scale(.97); }
    .cart-go:disabled { background: #e5e6ea; color: #b0b3ba; box-shadow: none; cursor: not-allowed; }

    /* ---------- 通用按钮 ---------- */
    .btn-primary {
      height: 42px; padding: 0 22px;
      border: none; border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-text); font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled { background: #e5e6ea; color: #b0b3ba; cursor: not-allowed; }

    /* ---------- 购物车清单弹层 ---------- */
    .mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 300;
      display: none; align-items: flex-end; justify-content: center;
    }
    .mask.show { display: flex; }
    .sheet {
      width: 100%; max-width: 430px;
      background: var(--card);
      border-radius: 20px 20px 0 0;
      max-height: 68vh;
      display: flex; flex-direction: column;
      animation: sheetUp .28s cubic-bezier(.22,1,.36,1);
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 18px 8px;
      font-size: 16px; font-weight: 700;
    }
    .sheet-clear {
      border: none; background: none;
      color: var(--text-3); font-size: 12px;
      display: flex; align-items: center; gap: 3px; cursor: pointer;
      padding: 4px 2px;
    }
    .sheet-list { overflow-y: auto; padding: 0 16px; flex: 1; }
    .sheet-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .sheet-item:last-child { border-bottom: none; }
    .si-thumb {
      width: 46px; height: 46px; border-radius: 10px;
      overflow: hidden; position: relative; flex-shrink: 0;
    }
    .si-thumb .dish-photo { position: static; width: 100%; height: 100%; }
    .si-thumb .mini-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; border-radius: 10px; }
    .si-info { flex: 1; min-width: 0; }
    .si-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .si-price { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 3px; }
    .sheet-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .sheet-total { font-size: 13px; color: var(--text-2); }

    /* ---------- 结算页（全屏） ---------- */
    .page {
      position: fixed; inset: 0; z-index: 400;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--bg);
      display: none; flex-direction: column;
    }
    .page.show { display: flex; animation: pageIn .25s ease; }
    @keyframes pageIn { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .page-head {
      background: var(--card);
      display: flex; align-items: center;
      padding: 12px 14px;
      padding-top: calc(12px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .page-back {
      border: none; background: none;
      font-size: 20px; color: var(--text);
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: absolute; left: 8px;
    }
    .page-title { flex: 1; text-align: center; font-size: 16px; font-weight: 700; }
    .page-body { flex: 1; overflow-y: auto; padding: 12px 12px 20px; }
    .page-foot {
      background: var(--card);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(0,0,0,.05);
    }
    .page-foot-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .ck-total { font-size: 13px; color: var(--text-2); }
    .ck-total .price .num { font-size: 24px; }
    .ck-submit { padding: 0 34px; }

    .ck-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 11px; }
    .ck-row { display: flex; align-items: center; padding: 6px 0; font-size: 14px; }
    .ck-label { color: var(--text-3); width: 76px; flex-shrink: 0; }
    .ck-value { font-weight: 700; font-size: 15px; color: var(--text); }
    .ck-select, .ck-input {
      flex: 1; height: 38px;
      border: 1px solid var(--line-strong); border-radius: 10px;
      padding: 0 10px; font-size: 14px;
      background: var(--input-bg); outline: none;
      color: var(--text);
    }
    .ck-select:focus, .ck-input:focus { border-color: var(--accent-2); }
    .ck-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .ck-card-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .ck-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .ck-item:last-child { border-bottom: none; }
    .ck-item .si-thumb { width: 50px; height: 50px; }
    .ck-item-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .ck-item-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .ck-item-total { font-size: 14px; font-weight: 700; color: var(--text); }
    .ck-textarea {
      width: 100%; min-height: 70px;
      border: 1px solid var(--line-strong); border-radius: 10px;
      padding: 10px 12px; font-size: 13px;
      font-family: inherit; resize: none; outline: none;
      background: var(--input-bg);
      color: var(--text);
    }
    .ck-textarea:focus { border-color: var(--accent-2); }

    /* ---------- 下单成功页 ---------- */
    .success-page { background: var(--success-grad); justify-content: center; align-items: center; }
    .success-card {
      background: var(--card); border-radius: 24px;
      width: 82%; max-width: 330px;
      padding: 36px 26px 30px;
      text-align: center;
      animation: pop .4s cubic-bezier(.22,1.4,.36,1);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-ring {
      width: 76px; height: 76px; margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px var(--accent-shadow-color);
      animation: ringIn .5s cubic-bezier(.22,1.4,.36,1) .1s backwards;
    }
    @keyframes ringIn { from { transform: scale(0); } to { transform: scale(1); } }
    .success-check { color: var(--btn-text); font-size: 40px; font-weight: 800; line-height: 1; }
    .success-card h2 { font-size: 21px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
    .success-card p { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
    .success-table {
      display: inline-block; margin: 6px 0 20px;
      background: var(--accent-bg); color: var(--accent-deep);
      font-size: 14px; font-weight: 700;
      padding: 6px 18px; border-radius: 999px;
    }
    .success-card .btn-primary { width: 100%; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; top: 48%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,20,20,.85);
      color: #fff; padding: 11px 20px;
      border-radius: 12px; font-size: 14px;
      z-index: 999;
      opacity: 0; transition: opacity .25s;
      pointer-events: none;
      max-width: 76vw; text-align: center;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- 返回商家后台（仅商家预览 preview=1 时显示） -->
  <div class="back-nav" id="backNav">
    <a class="back-link" onclick="window.location.href='/admin.html'">← 返回商家后台</a>
    <span class="hint">顾客扫码进入时不会显示本栏</span>
  </div>

  <div class="app">
    <!-- 顶部店铺横幅 -->
    <div class="banner" id="shopBanner">
      <div class="banner-content">
        <div class="shop-line">
          <span class="shop-logo" id="shopLogo">🍽️</span>
          <h1 class="shop-name" id="shopName">加载中…</h1>
        </div>
        <div class="banner-sub">
          <span class="table-pill">📍 <span id="tableInfo">未选桌</span></span>
          <span class="banner-slogan">欢迎光临 · 扫码点餐</span>
        </div>
      </div>
    </div>

    <!-- 骨架屏 -->
    <div class="sk-wrap" id="skeleton">
      <div class="sk-side">
        <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
      </div>
      <div class="sk-main">
        <div class="sk-card">
          <div class="sk sk-img"></div>
          <div class="sk-col"><div class="sk sk-line"></div><div class="sk sk-line short"></div><div class="sk sk-line tiny"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-img"></div>
          <div class="sk-col"><div class="sk sk-line"></div><div class="sk sk-line short"></div><div class="sk sk-line tiny"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-img"></div>
          <div class="sk-col"><div class="sk sk-line"></div><div class="sk sk-line short"></div><div class="sk sk-line tiny"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-img"></div>
          <div class="sk-col"><div class="sk sk-line"></div><div class="sk sk-line short"></div><div class="sk sk-line tiny"></div></div>
        </div>
      </div>
    </div>

    <!-- 主体 -->
    <div class="main" id="main" style="display:none">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content" id="content"></div>
    </div>
  </div>

  <!-- 底部购物车栏 -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner">
      <div class="cart-icon" id="cartIcon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2 2h3l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 6H6"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
      <div class="cart-mid">
        <div class="price"><span class="sym">¥</span><span class="num" id="cartTotal">0</span></div>
        <div class="cart-sub" id="cartCount">未选购商品</div>
      </div>
      <button class="cart-go" id="checkoutBtn" disabled>去结算</button>
    </div>
  </div>

  <!-- 购物车清单弹层 -->
  <div class="mask" id="cartMask">
    <div class="sheet">
      <div class="sheet-head">
        <span>已选菜品</span>
        <button class="sheet-clear" id="clearCartBtn">🗑 清空</button>
      </div>
      <div class="sheet-list" id="cartList"></div>
      <div class="sheet-foot">
        <div class="sheet-total">合计&nbsp;<span class="price"><span class="sym">¥</span><span class="num" id="sheetTotal">0</span></span></div>
        <button class="btn-primary" id="sheetCheckoutBtn">去结算</button>
      </div>
    </div>
  </div>

  <!-- 结算页 -->
  <div class="page" id="checkoutPage">
    <div class="page-head">
      <button class="page-back" id="ckBackBtn">←</button>
      <span class="page-title">确认订单</span>
    </div>
    <div class="page-body">
      <div class="ck-card">
        <div class="ck-row"><span class="ck-label">桌台号</span><span class="ck-value" id="ckTable">-</span></div>
        <div class="ck-row" id="ckTablePickRow" style="display:none"><span class="ck-label">选择桌台</span><select id="ckTableSelect" class="ck-select"></select></div>
        <div class="ck-row" id="ckTableInputRow" style="display:none"><span class="ck-label">填写桌号</span><input id="ckTableInput" class="ck-input" placeholder="如：5 或 A1"></div>
        <div class="ck-hint">请核对桌台号，如有误请联系服务员</div>
      </div>
      <div class="ck-card">
        <div class="ck-card-title">菜品清单</div>
        <div id="ckItems"></div>
      </div>
      <div class="ck-card">
        <div class="ck-card-title">订单备注</div>
        <textarea id="ckRemark" class="ck-textarea" maxlength="200" placeholder="口味偏好、忌口等（选填）"></textarea>
      </div>
    </div>
    <div class="page-foot">
      <div class="page-foot-inner">
        <div class="ck-total">合计&nbsp;<span class="price big"><span class="sym">¥</span><span class="num" id="ckTotal">0</span></span></div>
        <button class="btn-primary ck-submit" id="ckSubmitBtn">提交订单</button>
      </div>
    </div>
  </div>

  <!-- 下单成功页 -->
  <div class="page success-page" id="successPage">
    <div class="success-card">
      <div class="success-ring"><span class="success-check">✓</span></div>
      <h2>下单成功</h2>
      <p>后厨已接单，请耐心等待用餐</p>
      <div class="success-table" id="successTable"></div>
      <button class="btn-primary" id="successBackBtn">继续点餐</button>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <script src="js/customer.js"></script>
</body>
</html>
