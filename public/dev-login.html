<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>开发者登录 - 鼎恒餐饮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #ff6b35;
      --accent-2: #ff8e53;
      --red: #ef4444;
      --line: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 140%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .top {
      background: linear-gradient(135deg, #0f766e, #14b8a6 60%, var(--accent));
      color: #fff;
      padding: 30px 28px 26px;
      text-align: center;
    }
    .top .logo {
      width: 56px; height: 56px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .top h1 { font-size: 22px; font-weight: 700; }
    .top .sub { font-size: 13px; opacity: 0.9; margin-top: 6px; }
    .body { padding: 28px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; color: #4b5563;
      margin-bottom: 6px; font-weight: 500;
    }
    .input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 11px;
      font-size: 15px; background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,107,53,.14); }
    .alert {
      color: var(--red); font-size: 13px;
      margin-bottom: 12px; text-align: center;
      background: #fef2f2; padding: 9px;
      border-radius: 9px; display: none;
    }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 6px; transition: transform .1s, box-shadow .2s;
    }
    .btn:hover { box-shadow: 0 8px 20px rgba(255,107,53,.35); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .back { text-align: center; margin-top: 16px; }
    .back a { font-size: 13px; color: #9ca3af; text-decoration: none; }
    .back a:hover { color: var(--accent); }
    .tip { font-size: 12px; color: #bbb; text-align: center; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">🛠️</div>
      <h1>开发者登录</h1>
      <div class="sub">鼎恒餐饮·开发者控制台</div>
    </div>
    <div class="body">
      <div class="alert" id="alert"></div>
      <div class="form-group">
        <label>账号</label>
        <input type="text" class="input" id="username" placeholder="请输入开发者账号" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="input" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn">登 录</button>
      <div class="tip">开发者账号需在数据库手动创建<br>默认账号：admin / dingheng2024</div>
      <div class="back"><a href="/index.html">← 返回首页</a></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function showAlert(msg) {
      const el = $('alert');
      el.textContent = msg;
      el.style.display = 'block';
    }
    $('loginBtn').onclick = async () => {
      const username = $('username').value.trim();
      const password = $('password').value;
      if (!username || !password) return showAlert('请输入账号和密码');
      $('loginBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/dev/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(r => r.json());
        if (res.success) {
          localStorage.setItem('devToken', res.data.token);
          location.href = '/dev-console.html';
        } else {
          showAlert(res.message || '登录失败');
        }
      } catch (e) {
        showAlert('网络错误，请重试');
      } finally {
        $('loginBtn').disabled = false;
      }
    };
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
  </script>
</body>
</html>
