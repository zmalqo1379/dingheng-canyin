<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商家登录/注册 - 鼎恒餐饮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #ff6b35;
      --accent-2: #ff8e53;
      --red: #ef4444;
      --line: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7f3 0%, #fff 50%, #ffe9dd 100%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(255,107,53,0.18);
      overflow: hidden;
    }
    .top {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 28px 28px 24px;
      text-align: center;
    }
    .top .logo {
      width: 56px; height: 56px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .top h1 { font-size: 22px; font-weight: 700; }
    .top .sub { font-size: 13px; opacity: 0.9; margin-top: 6px; }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 15px;
      color: #9ca3af;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
      background: none;
      border-top: none; border-left: none; border-right: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .body { padding: 26px 28px 30px; }
    .pane { display: none; }
    .pane.active { display: block; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; color: #4b5563;
      margin-bottom: 6px; font-weight: 500;
    }
    .input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 11px;
      font-size: 15px; background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,107,53,.14); }
    .alert {
      color: var(--red); font-size: 13px;
      margin-bottom: 12px; text-align: center;
      background: #fef2f2; padding: 9px;
      border-radius: 9px; display: none;
    }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 6px; transition: transform .1s, box-shadow .2s;
    }
    .btn:hover { box-shadow: 0 8px 20px rgba(255,107,53,.35); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .back { text-align: center; margin-top: 16px; }
    .back a { font-size: 13px; color: #9ca3af; text-decoration: none; }
    .back a:hover { color: var(--accent); }
    .tip { font-size: 12px; color: #bbb; text-align: center; margin-top: 12px; }

    /* ============ 欢迎弹窗 ============ */
    .welcome-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: none; align-items: center; justify-content: center;
      background: rgba(17, 24, 39, 0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      padding: 20px;
    }
    .welcome-overlay.show { display: flex; animation: wFadeIn .25s ease both; }
    .welcome-card {
      width: 420px; max-width: 90%;
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.28), 0 4px 16px rgba(0,0,0,.12);
      position: relative;
    }
    .welcome-overlay.show .welcome-card { animation: wRise .38s cubic-bezier(.22,.85,.3,1.1) both; }
    @keyframes wFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .w-band {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; text-align: center;
      padding: 26px 52px 22px; position: relative;
    }
    .w-band h2 { font-size: 19px; font-weight: 700; letter-spacing: 2px; text-indent: 2px; }
    .w-band .w-bar { width: 36px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.5); margin: 12px auto 0; }
    .w-close {
      position: absolute; top: 10px; right: 10px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,.18); color: #fff;
      border: none; font-size: 15px; line-height: 30px;
      cursor: pointer; transition: background .2s;
    }
    .w-close:hover { background: rgba(255,255,255,.32); }
    .w-body { padding: 22px 26px 6px; }
    .w-body p { font-size: 13.5px; color: #4b5563; line-height: 1.85; margin: 0 0 9px; }
    .w-body p strong { color: #111827; font-weight: 700; }
    .w-body p.w-hot { color: var(--accent); font-weight: 700; }
    .w-cta { padding: 14px 26px 22px; }
    .w-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; letter-spacing: 2px;
      cursor: pointer; transition: transform .1s, box-shadow .2s;
      box-shadow: 0 10px 24px rgba(255,107,53,.32);
    }
    .w-btn:hover { box-shadow: 0 12px 28px rgba(255,107,53,.42); }
    .w-btn:active { transform: scale(.99); }
    .w-note { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">🏪</div>
      <h1>商家登录/注册</h1>
      <div class="sub">鼎恒餐饮 · 以采购为核心的智能管家</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="login">登录</button>
      <button class="tab" data-tab="register">注册</button>
    </div>
    <div class="body">
      <!-- 登录 -->
      <div class="pane active" id="pane-login">
        <div class="alert" id="loginAlert"></div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="input" id="loginPhone" placeholder="请输入手机号" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="input" id="loginPwd" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn">登 录</button>
        <div class="tip">登录成功后将跳转到管理后台</div>
      </div>

      <!-- 注册 -->
      <div class="pane" id="pane-register">
        <div class="alert" id="regAlert"></div>
        <div class="form-group">
          <label>店铺名称</label>
          <input type="text" class="input" id="shopName" placeholder="如：鼎恒餐饮">
        </div>
        <div class="form-group">
          <label>联系人姓名</label>
          <input type="text" class="input" id="contactName" placeholder="联系人姓名">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="input" id="regPhone" placeholder="手机号（用于登录）" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="input" id="regPwd" placeholder="设置登录密码" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" class="input" id="regPwd2" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <button class="btn" id="regBtn">注 册</button>
        <div class="tip">注册成功后将自动登录并跳转</div>
      </div>

      <div class="back"><a href="/index.html">← 返回首页</a></div>
    </div>
  </div>

  <!-- 欢迎弹窗：首次访问显示，关闭后 7 天内不再显示 -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div class="w-band">
        <h2>欢迎加入鼎恒科技</h2>
        <div class="w-bar"></div>
        <button class="w-close" id="welcomeClose" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="w-body">
        <p>开店这套系统，终身免费。</p>
        <p>智能补货、采购下单、扫码点餐、后厨看单——一分钱不收。</p>
        <p>在这里进货，价格不高于你平时的批发价，每花 1 元，还送鼎恒币。</p>
        <p>鼎恒币能干什么？</p>
        <p><strong>抵采购的现金，换平台的会员。</strong></p>
        <p>会算账的老板已经发现了：</p>
        <p class="w-hot">系统免费用，会员不花钱，进货还省钱。</p>
        <p>你只管开店，剩下的交给我们。</p>
      </div>
      <div class="w-cta">
        <button class="w-btn" id="welcomeCta" type="button">立即免费使用</button>
        <div class="w-note">注册即送首月进阶版会员（价值 ¥99）</div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // 欢迎弹窗：首次访问显示，关闭后 7 天内不再显示（记录关闭时间戳）
    const WELCOME_KEY = 'merchant_welcome_closed_at';
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const welcomeOverlay = $('welcomeOverlay');
    (function maybeShowWelcome() {
      const closedAt = Number(localStorage.getItem(WELCOME_KEY) || 0);
      if (closedAt && Date.now() - closedAt < WEEK_MS) return;
      setTimeout(() => welcomeOverlay.classList.add('show'), 300);
    })();
    function closeWelcome() {
      welcomeOverlay.classList.remove('show');
      localStorage.setItem(WELCOME_KEY, String(Date.now()));
    }
    $('welcomeClose').onclick = closeWelcome;
    welcomeOverlay.addEventListener('click', (e) => {
      if (e.target === welcomeOverlay) closeWelcome();
    });
    $('welcomeCta').onclick = () => {
      closeWelcome();
      document.querySelector('.tab[data-tab="register"]').click();
    };

    // 标签切换
    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
        const tab = t.dataset.tab;
        $('pane-login').classList.toggle('active', tab === 'login');
        $('pane-register').classList.toggle('active', tab === 'register');
        $('loginAlert').style.display = 'none';
        $('regAlert').style.display = 'none';
      };
    });

    function showAlert(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
    }

    // 登录
    $('loginBtn').onclick = async () => {
      const phone = $('loginPhone').value.trim();
      const password = $('loginPwd').value;
      if (!phone || !password) return showAlert($('loginAlert'), '请输入手机号和密码');
      $('loginBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/merchant/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        }).then(r => r.json());
        if (res.success) {
          localStorage.setItem('merchantToken', res.data.token);
          localStorage.setItem('merchantShopId', res.data.shopId);
          localStorage.setItem('merchantShopName', res.data.shopName);
          location.href = '/admin.html';
        } else {
          showAlert($('loginAlert'), res.message || '登录失败');
        }
      } catch (e) {
        showAlert($('loginAlert'), '网络错误，请重试');
      } finally {
        $('loginBtn').disabled = false;
      }
    };

    // 注册
    $('regBtn').onclick = async () => {
      const shopName = $('shopName').value.trim();
      const contactName = $('contactName').value.trim();
      const phone = $('regPhone').value.trim();
      const password = $('regPwd').value;
      const confirm = $('regPwd2').value;
      if (!shopName || !contactName || !phone || !password) return showAlert($('regAlert'), '请填写完整信息');
      if (password !== confirm) return showAlert($('regAlert'), '两次输入的密码不一致');
      if (password.length < 6) return showAlert($('regAlert'), '密码至少6位');
      $('regBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/merchant/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shopName, contactName, phone, password, confirm })
        }).then(r => r.json());
        if (res.success) {
          localStorage.setItem('merchantToken', res.data.token);
          localStorage.setItem('merchantShopId', res.data.shopId);
          localStorage.setItem('merchantShopName', res.data.shopName);
          location.href = '/admin.html';
        } else {
          showAlert($('regAlert'), res.message || '注册失败');
        }
      } catch (e) {
        showAlert($('regAlert'), '网络错误，请重试');
      } finally {
        $('regBtn').disabled = false;
      }
    };
  </script>
</body>
</html>
